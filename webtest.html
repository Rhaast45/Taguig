<!DOCTYPE html>
<head>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: url("patrizion.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        button {
            padding: 20px 40px;
            font-size: 18px;
            background: linear-gradient(135deg, #ff0000 0%, #fff878 100%);
            color: rgb(255, 222, 222);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button onclick="RedirectToGames()">PLAY</button>

    <script>
        function RedirectToGames() {
            window.open("games.html");
        }
    </script>
</body>
