<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taguig Battle Ground</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0a0612;
      background-image: url("asset/Babel.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #89f200;
      overflow: hidden;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #c40000;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
    }
    #hud {
      display: flex;
      gap: 24px;
      font-size: 0.85rem;
      margin-bottom: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #hud { color: #000000; }
    #hud strong { color: #206803; }
    canvas {
      border: 2px solid #ff0000;
      border-radius: 4px;
      box-shadow: 0 0 40px rgba(160, 20, 20, 0.25);
      cursor: crosshair;
      max-width: 100vw;
    }
  </style>
</head>
<body>
  <h1>Taguig Battle Ground</h1>
  <div id="hud">
    <div>Time: <strong id="time">0:00</strong></div>
    <div>Level: <strong id="level">1</strong></div>
    <div>XP: <strong id="xp">0</strong> / <strong id="xpNeed">10</strong></div>
    <div>Kills: <strong id="kills">0</strong></div>
  </div>
  <canvas id="game" width="800" height="500"></canvas>
  <audio id="bgm" loop preload="auto">
    <source src="audio/02. BGM1.flac" type="audio/flac">
  </audio>

  <script>
    const canvas = document.getElementById("game");
    const bgm = document.getElementById("bgm");
    bgm.volume = 0.80;
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    const keys = {};
    let gameState = "menu"; // menu | playing | levelup | dead
    let gameTime = 0;
    let kills = 0;

    const player = {
      x: W / 2, y: H / 2, r: 14, speed: 2.8,
      hp: 100, maxHp: 100,
      level: 1, xp: 0, xpToNext: 10,
      weapons: []
    };

    const enemies = [];
    const gems = [];
    const projectiles = [];
    const particles = [];
    let spawnTimer = 0;
    let spawnRate = 90;

    const SPRITES = {
      player: { src: "asset/Doctor_(AK)_full_body.png", img: new Image() },
      enemy: { src: "asset/Reunion_Phantom_Crossbowman.png", img: new Image() }
    };
    for (const s of Object.values(SPRITES)) {
      s.img.src = s.src;
    }

    function drawSprite(img, x, y, radius) {
      if (!img.complete || !img.naturalWidth) return false;
      const w = radius * 4.4;
      const h = w * (img.naturalHeight / img.naturalWidth);
      ctx.save();
      ctx.globalCompositeOperation = "lighten";
      ctx.drawImage(img, x - w / 2, y - h / 2, w, h);
      ctx.restore();
      return true;
    }

    const WEAPON_TYPES = {
      orb: { name: "Blood Orbs", color: "#fc0000", damage: 12, cooldown: 45, count: 3, speed: 0.04, radius: 70 },
      bolt: { name: "Shadow Bolts", color: "#0055ff", damage: 18, cooldown: 30, speed: 5 },
      aura: { name: "Crimson Aura", color: "#ff2244", damage: 4, cooldown: 8, radius: 55 }
    };

    function playBgm() {
      if (bgm.paused) bgm.play().catch(() => {});
    }

    document.addEventListener("keydown", e => {
      keys[e.code] = true;
      if (gameState === "menu" && (e.code === "Space" || e.code === "Enter")) startGame();
      if (gameState === "levelup" && e.key >= "1" && e.key <= "3") pickUpgrade(parseInt(e.key) - 1);
      if (gameState === "dead" && e.code === "Space") startGame();
    });
    document.addEventListener("keyup", e => { keys[e.code] = false; });
    canvas.addEventListener("click", () => {
      if (gameState === "menu") startGame();
      else playBgm();
    });

    const touch = { active: false, id: null, startX: 0, startY: 0, dx: 0, dy: 0 };
    const JOYSTICK_DEAD = 10;
    const JOYSTICK_MAX = 60;

    function canvasTouchPos(t) {
      const r = canvas.getBoundingClientRect();
      return { x: (t.clientX - r.left) * (W / r.width), y: (t.clientY - r.top) * (H / r.height) };
    }

    canvas.addEventListener("touchstart", e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      if (gameState === "menu" || gameState === "dead") { startGame(); return; }
      if (gameState === "levelup") {
        const pos = canvasTouchPos(t);
        for (let i = 0; i < upgradeOptions.length; i++) {
          const y = H / 2 + 20 + i * 36;
          if (pos.x > W / 2 - 180 && pos.x < W / 2 + 180 && pos.y > y - 18 && pos.y < y + 14) {
            pickUpgrade(i);
            return;
          }
        }
        return;
      }
      if (!touch.active) {
        touch.active = true;
        touch.id = t.identifier;
        touch.startX = t.clientX;
        touch.startY = t.clientY;
        touch.dx = 0;
        touch.dy = 0;
      }
    }, { passive: false });

    canvas.addEventListener("touchmove", e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier === touch.id) {
          touch.dx = t.clientX - touch.startX;
          touch.dy = t.clientY - touch.startY;
        }
      }
    }, { passive: false });

    canvas.addEventListener("touchend", e => {
      for (const t of e.changedTouches) {
        if (t.identifier === touch.id) {
          touch.active = false;
          touch.id = null;
          touch.dx = 0;
          touch.dy = 0;
        }
      }
    });
    canvas.addEventListener("touchcancel", e => {
      for (const t of e.changedTouches) {
        if (t.identifier === touch.id) {
          touch.active = false;
          touch.id = null;
          touch.dx = 0;
          touch.dy = 0;
        }
      }
    });

    function startGame() {
      playBgm();
      gameState = "playing";
      gameTime = 0;
      kills = 0;
      enemies.length = 0;
      gems.length = 0;
      projectiles.length = 0;
      particles.length = 0;
      spawnTimer = 0;
      spawnRate = 90;
      player.x = W / 2;
      player.y = H / 2;
      player.hp = player.maxHp = 100;
      player.level = 1;
      player.xp = 0;
      player.xpToNext = 10;
      player.speed = 2.8;
      player.weapons = [{ type: "orb", level: 1, timer: 0, angle: 0 }];
      upgradeOptions = [];
      updateHud();
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function spawnEnemy() {
      const edge = Math.floor(Math.random() * 4);
      let x, y;
      const pad = 30;
      if (edge === 0) { x = Math.random() * W; y = -pad; }
      else if (edge === 1) { x = W + pad; y = Math.random() * H; }
      else if (edge === 2) { x = Math.random() * W; y = H + pad; }
      else { x = -pad; y = Math.random() * H; }

      const t = gameTime / 60;
      const baseHp = 8 + t * 2;
      const baseSpeed = 0.6 + Math.min(t * 0.02, 1.2);
      enemies.push({
        x, y,
        r: 10 + Math.random() * 6,
        hp: baseHp,
        maxHp: baseHp,
        speed: baseSpeed + Math.random() * 0.3,
        damage: 8 + Math.floor(t / 30),
        xp: 3 + Math.floor(t / 20)
      });
    }

    function spawnParticles(x, y, color, n = 6) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1 + Math.random() * 3;
        particles.push({
          x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: 20 + Math.random() * 15, color, r: 2 + Math.random() * 3
        });
      }
    }

    function damageEnemy(e, dmg) {
      e.hp -= dmg;
      if (e.hp <= 0) {
        gems.push({ x: e.x, y: e.y, r: 5, xp: e.xp, pulse: 0 });
        spawnParticles(e.x, e.y, "#8844cc", 8);
        const idx = enemies.indexOf(e);
        if (idx >= 0) enemies.splice(idx, 1);
        kills++;
      }
    }

    function fireBolt(w) {
      const def = WEAPON_TYPES.bolt;
      let nearest = null, best = 9999;
      for (const e of enemies) {
        const d = dist(player, e);
        if (d < best) { best = d; nearest = e; }
      }
      if (!nearest) return;
      const ang = Math.atan2(nearest.y - player.y, nearest.x - player.x);
      projectiles.push({
        x: player.x, y: player.y,
        vx: Math.cos(ang) * def.speed,
        vy: Math.sin(ang) * def.speed,
        r: 6, damage: def.damage * (1 + w.level * 0.3),
        color: def.color, life: 120
      });
    }

    function updateWeapons() {
      for (const w of player.weapons) {
        w.timer--;
        const def = WEAPON_TYPES[w.type];
        if (w.type === "orb") {
          w.angle += def.speed * (1 + w.level * 0.2);
          const count = def.count + w.level - 1;
          const r = def.radius + w.level * 8;
          for (let i = 0; i < count; i++) {
            const a = w.angle + (Math.PI * 2 * i) / count;
            const ox = player.x + Math.cos(a) * r;
            const oy = player.y + Math.sin(a) * r;
            for (const e of enemies) {
              if (dist({ x: ox, y: oy }, e) < e.r + 10) {
                damageEnemy(e, def.damage * (1 + w.level * 0.25) * 0.15);
              }
            }
          }
        }
        if (w.type === "bolt" && w.timer <= 0) {
          const shots = 1 + Math.floor(w.level / 2);
          for (let s = 0; s < shots; s++) fireBolt(w);
          w.timer = Math.max(12, def.cooldown - w.level * 4);
        }
        if (w.type === "aura" && w.timer <= 0) {
          const rad = def.radius + w.level * 12;
          for (const e of enemies) {
            if (dist(player, e) < rad + e.r) damageEnemy(e, def.damage * (1 + w.level * 0.3));
          }
          w.timer = def.cooldown;
        }
      }
    }

    function updatePlayer() {
      let dx = 0, dy = 0;
      if (keys["KeyW"] || keys["ArrowUp"]) dy -= 1;
      if (keys["KeyS"] || keys["ArrowDown"]) dy += 1;
      if (keys["KeyA"] || keys["ArrowLeft"]) dx -= 1;
      if (keys["KeyD"] || keys["ArrowRight"]) dx += 1;
      if (touch.active) {
        const mag = Math.hypot(touch.dx, touch.dy);
        if (mag > JOYSTICK_DEAD) {
          const clamped = Math.min(mag, JOYSTICK_MAX);
          dx += (touch.dx / mag) * (clamped / JOYSTICK_MAX);
          dy += (touch.dy / mag) * (clamped / JOYSTICK_MAX);
        }
      }
      if (dx || dy) {
        const len = Math.hypot(dx, dy) || 1;
        player.x += (dx / len) * player.speed;
        player.y += (dy / len) * player.speed;
      }
      player.x = Math.max(player.r, Math.min(W - player.r, player.x));
      player.y = Math.max(player.r, Math.min(H - player.r, player.y));
    }

    function updateEnemies() {
      for (const e of enemies) {
        const ang = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(ang) * e.speed;
        e.y += Math.sin(ang) * e.speed;
        if (dist(player, e) < player.r + e.r - 4) {
          player.hp -= e.damage * 0.08;
          e.x -= Math.cos(ang) * 4;
          e.y -= Math.sin(ang) * 4;
          spawnParticles(player.x, player.y, "#ff0044", 2);
          if (player.hp <= 0) gameState = "dead";
        }
      }
    }

    function updateProjectiles() {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0 || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
          projectiles.splice(i, 1);
          continue;
        }
        for (const e of enemies) {
          if (dist(p, e) < p.r + e.r) {
            damageEnemy(e, p.damage);
            spawnParticles(p.x, p.y, p.color, 4);
            projectiles.splice(i, 1);
            break;
          }
        }
      }
    }

    function updateGems() {
      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        g.pulse += 0.1;
        const d = dist(player, g);
        if (d < 120) {
          const pull = d < 40 ? 0.35 : 0.12;
          const ang = Math.atan2(player.y - g.y, player.x - g.x);
          g.x += Math.cos(ang) * pull * 8;
          g.y += Math.sin(ang) * pull * 8;
        }
        if (d < player.r + g.r) {
          player.xp += g.xp;
          gems.splice(i, 1);
          if (player.xp >= player.xpToNext) levelUp();
        }
      }
    }

    function levelUp() {
      player.level++;
      player.xp -= player.xpToNext;
      player.xpToNext = Math.floor(10 + player.level * 8);
      player.hp = Math.min(player.maxHp, player.hp + 25);
      gameState = "levelup";
      upgradeOptions = getUpgradeOptions();
    }

    function getUpgradeOptions() {
      const opts = [];
      const addWeapon = type => {
        const w = player.weapons.find(x => x.type === type);
        if (w && w.level < 5) opts.push({ kind: "weapon", type, label: `${WEAPON_TYPES[type].name} Lv.${w.level + 1}` });
        else if (!w) opts.push({ kind: "newWeapon", type, label: `Unlock ${WEAPON_TYPES[type].name}` });
      };
      addWeapon("orb");
      addWeapon("bolt");
      addWeapon("aura");
      opts.push({ kind: "speed", label: "Swift Feet (+15% speed)" });
      opts.push({ kind: "hp", label: "Dark Vitality (+25 max HP)" });
      opts.push({ kind: "heal", label: "Blood Feast (full heal)" });
      const shuffled = opts.sort(() => Math.random() - 0.5);
      return shuffled.slice(0, 3);
    }

    let upgradeOptions = [];

    function pickUpgrade(idx) {
      const u = upgradeOptions[idx];
      if (!u) return;
      if (u.kind === "newWeapon") {
        player.weapons.push({ type: u.type, level: 1, timer: 0, angle: 0 });
      } else if (u.kind === "weapon") {
        const w = player.weapons.find(x => x.type === u.type);
        if (w) w.level++;
      } else if (u.kind === "speed") player.speed *= 1.15;
      else if (u.kind === "hp") { player.maxHp += 25; player.hp += 25; }
      else if (u.kind === "heal") player.hp = player.maxHp;
      gameState = "playing";
      upgradeOptions = [];
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        p.vx *= 0.95;
        p.vy *= 0.95;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function updateHud() {
      const m = Math.floor(gameTime / 60);
      const s = Math.floor(gameTime % 60);
      document.getElementById("time").textContent = `${m}:${s.toString().padStart(2, "0")}`;
      document.getElementById("level").textContent = player.level;
      document.getElementById("xp").textContent = Math.floor(player.xp);
      document.getElementById("xpNeed").textContent = player.xpToNext;
      document.getElementById("kills").textContent = kills;
    }

    function drawBackground() {
      ctx.fillStyle = "#12091c";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(80, 40, 120, 0.15)";
      ctx.lineWidth = 1;
      const grid = 40;
      for (let x = 0; x < W; x += grid) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y < H; y += grid) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      if (!drawSprite(SPRITES.player.img, player.x, player.y, player.r)) {
        ctx.fillStyle = "#ffccaa";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
        ctx.fill();
      }

      const auraW = player.weapons.find(w => w.type === "aura" && w.level > 0);
      if (auraW) {
        const def = WEAPON_TYPES.aura;
        const rad = def.radius + auraW.level * 12;
        ctx.strokeStyle = `rgba(255, 34, 68, ${0.2 + Math.sin(gameTime * 0.1) * 0.1})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x, player.y, rad, 0, Math.PI * 2);
        ctx.stroke();
      }

      const barW = 40;
      ctx.fillStyle = "#330022";
      ctx.fillRect(player.x - barW / 2, player.y - player.r - 12, barW, 5);
      ctx.fillStyle = "#ff2266";
      ctx.fillRect(player.x - barW / 2, player.y - player.r - 12, barW * (player.hp / player.maxHp), 5);
    }

    function drawOrbs() {
      const w = player.weapons.find(x => x.type === "orb");
      if (!w) return;
      const def = WEAPON_TYPES.orb;
      const count = def.count + w.level - 1;
      const r = def.radius + w.level * 8;
      for (let i = 0; i < count; i++) {
        const a = w.angle + (Math.PI * 2 * i) / count;
        const ox = player.x + Math.cos(a) * r;
        const oy = player.y + Math.sin(a) * r;
        const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, 12);
        g.addColorStop(0, "#ff88aa");
        g.addColorStop(1, def.color);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(ox, oy, 10, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawEnemies() {
      for (const e of enemies) {
        if (!drawSprite(SPRITES.enemy.img, e.x, e.y, e.r)) {
          ctx.fillStyle = "#6622aa";
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
          ctx.fill();
        }
        const bw = e.r * 2;
        ctx.fillStyle = "#1a0828";
        ctx.fillRect(e.x - bw / 2, e.y - e.r - 8, bw, 3);
        ctx.fillStyle = "#8844cc";
        ctx.fillRect(e.x - bw / 2, e.y - e.r - 8, bw * (e.hp / e.maxHp), 3);
      }
    }

    function drawGems() {
      for (const g of gems) {
        const s = 1 + Math.sin(g.pulse) * 0.2;
        ctx.fillStyle = "#44ffcc";
        ctx.shadowColor = "#44ffcc";
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(g.x, g.y - 5 * s);
        ctx.lineTo(g.x + 4 * s, g.y);
        ctx.lineTo(g.x, g.y + 5 * s);
        ctx.lineTo(g.x - 4 * s, g.y);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function drawProjectiles() {
      for (const p of projectiles) {
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = p.life / 35;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawOverlay(title, lines, hint) {
      ctx.fillStyle = "transparent";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff"; 
      ctx.font = "bold 36px Segoe UI, sans-serif";
      ctx.fillText(title, W / 2, H / 2 - 50);
      ctx.fillStyle = "#ffffff"; 
      ctx.font = "16px Segoe UI, sans-serif";
      lines.forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + i * 28));
      ctx.fillStyle = "#ffffff";
      ctx.font = "14px Segoe UI, sans-serif";
      ctx.fillText(hint, W / 2, H / 2 + lines.length * 28 + 30);
    }

    function drawLevelUp() {
      if (!upgradeOptions.length) upgradeOptions = getUpgradeOptions();
      drawOverlay("Level Up!", ["Choose an upgrade:"], "");
      ctx.textAlign = "left";
      upgradeOptions.forEach((u, i) => {
        const y = H / 2 + 20 + i * 36;
        ctx.fillStyle = "rgba(255, 255, 244, 0.92)";
        ctx.fillRect(W / 2 - 180, y - 18, 360, 32);
        ctx.strokeStyle = "#8b0000";
        ctx.strokeRect(W / 2 - 180, y - 18, 360, 32);
        ctx.fillStyle = "#a01818";
        ctx.font = "15px Segoe UI, sans-serif";
        ctx.fillText(`[${i + 1}] ${u.label}`, W / 2 - 165, y + 5);
      });
      ctx.textAlign = "center";
      ctx.fillStyle = "#6d0000";
      ctx.font = "13px Segoe UI, sans-serif";
      ctx.fillText("Press 1, 2, or 3 — or tap an option", W / 2, H / 2 + 140);
    }

    function update() {
      if (gameState === "playing") {
        gameTime++;
        updatePlayer();
        updateWeapons();
        updateEnemies();
        updateProjectiles();
        updateGems();
        updateParticles();

        spawnTimer--;
        if (spawnTimer <= 0) {
          const wave = 1 + Math.floor(gameTime / 600);
          for (let i = 0; i < wave; i++) spawnEnemy();
          spawnTimer = Math.max(25, spawnRate - Math.floor(gameTime / 120));
        }

        updateHud();
      }
    }

    function draw() {
      drawBackground();
      if (gameState === "menu") {
        drawOverlay("Taguig Battle Ground", [
          "WASD or Arrow keys to move",
          "Weapons attack automatically",
          "Collect gems · Level up · Grow stronger"
        ], "Press SPACE or tap to start");
        return;
      }
      drawGems();
      drawEnemies();
      drawOrbs();
      drawProjectiles();
      drawPlayer();
      drawParticles();

      if (gameState === "levelup") drawLevelUp();
      if (gameState === "dead") {
        const m = Math.floor(gameTime / 60);
        const s = Math.floor(gameTime % 60);
        drawOverlay("You Died", [
          `Survived ${m}:${s.toString().padStart(2, "0")}`,
          `Level ${player.level} · ${kills} kills`
        ], "Press SPACE or tap to try again");
      }

      if (touch.active && gameState === "playing") {
        const r = canvas.getBoundingClientRect();
        const sx = touch.startX - r.left;
        const sy = touch.startY - r.top;
        const scaleX = W / r.width;
        const scaleY = H / r.height;
        const cx = sx * scaleX;
        const cy = sy * scaleY;
        const mag = Math.min(Math.hypot(touch.dx, touch.dy), JOYSTICK_MAX);
        const ang = Math.atan2(touch.dy, touch.dx);
        ctx.globalAlpha = 0.25;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, JOYSTICK_MAX * scaleX, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(cx + Math.cos(ang) * mag * scaleX, cy + Math.sin(ang) * mag * scaleY, 14 * scaleX, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
