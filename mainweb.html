<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taguig Battle Ground</title>
</head>
<style>
    body {
        background-image: url("asset/patrizion.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        background: linear-gradient(135deg, #ff0000 0%, #faff5c 100%);
        color: rgb(255, 222, 222);
        border: none;
        border-radius: 8px;
    }
    h1 {
        font-size: 24px;
        color: rgb(255, 94, 0);
        -webkit-text-stroke: 1px #000;
        text-shadow: 0 0 10px rgba(255, 222, 222, 0.5);
    }
    button:hover {
        background: linear-gradient(135deg, #ff0000 0%, #fff878 100%);
        color: rgb(255, 222, 222);
        border: none;
        border-radius: 8px;
    }
    button:active {
        background: linear-gradient(135deg, #ff0000 0%, #fff878 100%);
        color: rgb(255, 222, 222);
        border: none;
        border-radius: 8px;
    }
    button:focus {
        background: linear-gradient(135deg, #ff0000 0%, #fff878 100%);
        color: rgb(255, 222, 222);
        border: none;
        border-radius: 8px;
    }
    button:disabled {
        background: linear-gradient(135deg, #ff0000 0%, #fff878 100%);
        color: rgb(255, 222, 222);
        border: none;
        border-radius: 8px;
    }
    button:hover:disabled {
        background: linear-gradient(135deg, #ff0000 0%, #fff878 100%);
        color: rgb(255, 222, 222);
    }
</style>
<body>
    <h1>Taguig Battle Ground</h1>
    <button onclick="RedirGames()">PLAY</button>
    <script>
        function RedirGames() {
            window.location.href = "games.html";
        }
    </script>
</body>
</html>
